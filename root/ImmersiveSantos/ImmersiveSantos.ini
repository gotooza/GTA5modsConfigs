DriveByRange=70
; The driver, weights: floors it and drives away / chases you and rams you / stops, gets out and fights (armed drivers only).
DriverFleeChance=60
DriverRamChance=25
DriverStopAndFightChance=15
; How fast a driver who runs drives (the game's units, about metres per second).
DriverFleeSpeed=50

; THE DRIVER IS KILLED (or the car is wrecked or on fire): everybody still in the car gets out (a moving car: they jump) after a random delay.
