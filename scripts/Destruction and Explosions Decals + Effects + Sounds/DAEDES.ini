; DAEDES settings
; key names: https://learn.microsoft.com/dotnet/api/system.windows.forms.keys
; reload scripts in game (Insert) after changing stuff

[Keys]
; clears fires, scorch marks and smoke around you. None = no key
Cleanup=Delete

[Auto]
; 1 light, 2 normal, 3 heavy, 4 extreme
DestructionLevel=2
; metres - explosions further away are ignored
DetectionRadius=300
MaxDestructionsPerSecond=8
IncludeExplosiveAmmo=true
; extra secondary blasts around the big ones
ChainBlasts=false

[Marks]
SootStreaks=true
; smoke keeps rising after bigger blasts
LingeringSmoke=true
; moves wall marks off the wall a bit (-0.3 to 1). leave at 0,
; anything positive and they stop showing up
WallMarkOffset=0

[Pipes]
; road craters can burst a water main or gas line. street level only,
; not roofs/bridges/parking decks, and never two within 15m
Enabled=true
; % chance for rpg/car sized blasts. grenades x0.3, big blasts x2, level scales it too
WaterMainChance=30
GasLineChance=12
; seconds, +/- 30%
DurationSeconds=60
MaxActive=4
; angled jet of water/flame out of the pipe
AngledJet=true
; broken pipe sticking out of the crater (random pipe model, angle and length)
BrokenPipe=true
; random colours on pipe models that have them
PipeColours=true
; gas flame is real fire - burns peds and sets cars alight
GasFlameHurts=true

[BuildingFires]
; buildings hit by explosions can catch fire (flames, black smoke, embers, wall slowly blackens)
Enabled=true
; % chance for rpg/car sized blasts. grenades x0.4, big blasts x2,
; wood x2, glass x1.3, metal x0.6, level scales it too
Chance=100
DurationSeconds=75
MaxActive=6
; real game fire on roofs and at the foot of the wall
RealFire=true
; how far the real fire can spread (0-25)
FireSpread=2

[Sounds]
; plays your own .wav files on hits. folders get made the first time you run it:
;   scripts\DAEDES_Sounds\Buildings   walls, glass, roofs
;   scripts\DAEDES_Sounds\Roads       road, pavement, grass, dirt
;   scripts\DAEDES_Sounds\Explosions  every explosion, mid-air too
; picks a random file from the folder. plain pcm wav only (8/16/24/32 bit or 32 bit float)
; the explosion one plays on top of the game's own bang, can't mute that from a script
Enabled=true
; buildings + roads volume (0-100)
DebrisVolume=80
; metres
Range=200
; explosions volume (0-100)
ExplosionVolume=100
; metres
ExplosionRange=400
MaxAtOnce=8
; far away hits are heard a bit later, like real sound
SpeedOfSoundDelay=true

[General]
NeverWanted=false
; knock loose lamp posts, signs, bins etc
BreakLooseMapProps=true
; false = fires get put out after ~1.5s
LeaveFiresBurning=true
; spawns real pebble props. off by default, they sometimes fall through
; the ground and too many can use up object slots
PhysicalDebris=false
MaxDebrisPieces=60
DebrisLifetimeSeconds=120
MaxPropsSmashedPerBlast=60

[Debug]
; writes scripts\DAEDES.log
WriteLog=false
