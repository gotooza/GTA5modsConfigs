[ArmedNpcs]
; ARMED PEOPLE DEFEND THEMSELVES. In a crime scene with armed people (robberies, heists, muggings, carjackings, drug and gun deals, gang scenes...)
; nobody stands still while you shoot at them. Once you set a scene off, every armed person in it decides, once, what to do:
;   on foot       fight back, run away or give up (weights below)
;   in a car      the passengers shoot at you from the windows; the driver floors it, rams you or stops to fight
;   driver killed (or the car wrecked) everybody still inside bails out after a short delay and fights, runs or gives up
; Unarmed people never fight: they run or give up. Which scenes use it is in [ArmedNpcsEvents]. The kidnapping is never touched.
; Master switch. 0 = armed people never shoot at you, they only run or give up.
Enabled=1
; 1 = they only shoot back where [GunFights] allows gunfire (dangerous zones, at night). 0 = they defend themselves anywhere, in daylight too.
; (Enabled=0 and NoShooting=1 in [GunFights] always win: then they never shoot.)
RespectGunFightZones=0
; Write every decision (who fights, runs, gives up, bails out) to the log file (ImmersiveSantos.log, level 2 or more).
LogDecisions=1

; WHAT SETS THEM OFF (any of these; each one switches the whole scene on)
; You hurt or kill one of them.
ReactToDamage=1
; You shoot or ram a car with one of them inside.
ReactToVehicleDamage=1
; You keep a gun on one of them for AimSeconds; then it sets the scene off with chance AimReactChance (rolled once per time you aim).
ReactToAiming=1
AimSeconds=2
AimReactChance=40
; You fire a shot closer than NearbyShotRadius metres to one of them (even if you miss); chance NearbyShotReactChance, checked at most every 3 seconds.
ReactToNearbyShots=1
NearbyShotRadius=25
NearbyShotReactChance=35

; ON FOOT: weights, they do not have to add up to 100 (60/25/15 = 60% fight, 25% run, 15% give up). Somebody without a weapon only runs or
; gives up. Scenes that cannot show a surrender (mugging, bank, heist, armoured truck) turn it into running. An event can have its own fight
; chance in [ArmedNpcsEvents]; then the rest is shared between running and giving up in the same proportion.
FightBackChance=60
FleeChance=25
SurrenderChance=15
; A fighter whose health falls below WoundedBelowPercent may lose his nerve (once): chance WoundedBreakChance. Of those, WoundedSurrenderShare
; percent put their hands up, the rest run.
WoundedBelowPercent=30
WoundedBreakChance=35
WoundedSurrenderShare=40

