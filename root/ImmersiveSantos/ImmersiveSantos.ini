; Overall frequency of every gunfight type (1.0 = as configured, 0.5 = half as often, 0 = never)
Frequency=0.5
; Gunfights allowed at the same time
MaxActive=1
; QUIET CITY. 1 = nobody fires a shot on their own outside the dangerous places below (gang areas, desert, forests). Not even the police.
