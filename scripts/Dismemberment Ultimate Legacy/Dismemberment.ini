; Dismemberment Mod - Settings
; MenuKey   = Key to open/close the menu.
;             Examples: PageUp, PageDown, Insert, Home, End, F5, Delete
; Lang      = Menu language: 0=English 1=Italiano 2=Espanol 3=Deutsch 4=Francais 5=Russian 6=Portugues-BR 7=Polski 8=Ukrainian 9=Tagalog
; BodyCount = Kill counter HUD on/off (true/false)
; BcDesign  = Color: 0=Green 1=Red 2=Amber
; BcX/BcY   = Kill count position (0..1, screen fraction, panel center)
; BcSize    = Kill count size: 0=XS 1=S 2=M 3=L 4=XL
; VehKills  = Count vehicle kills (true/false)
; KillCount = saved kill counter (persistent, reset in the menu)
; MenuX/Y   = Menu position (0..1, screen fraction)
; MenuScale = Menu size (0.55..1.30)
; ModEnabled= Mod active (true/false)
; ErrorLog  = Error log for bug reports (true/false, default false):
;             writes errors to DismembermentError.log in the main GTA folder
; VehicleGore= Sever limbs when run over/rammed by a vehicle (true/false)
; DisarmShot = shooting the held weapon directly disarms
;             the ped (no sever on that hit):
;             1 = on (default), 0 = off. Works in every mode.
; DisarmRadius = how close the hit must be to the weapon hand,
;             in meters. Default 0.22.
; DisarmReach = larger reach for hits where no bone is
;             in cutting range - i.e. shots on the barrel
;             or the stock. Default 0.60. Higher = easier to
;             disarm, but misses next to the ped count too.
; DamageKeepAlive = in damage mode the ped holds on until the
;             hit counter reaches the threshold (like MeleeKeepAlive):
;             1 = on (default), 0 = off.
; VehicleLimbs = how many parts a vehicle tears off at most:
;             1 to 5. Default 2. At 5 the head can come off too
;             (= old behaviour, ALL parts).
; VehCutGuard = safety valve against vanishing cars: if a vehicle is
;             closer than this many meters to the ped, no cut
;             happens at all. 0 = off (default). 3.0 would have
;             prevented every known case - but costs dismemberments
;             near cars.
; DamageKeepHealth = the value the ped is refilled to between
;             hits in damage mode. Default 200.
; VehGuardSeatMax = peds farther than this many meters from the
;             nearest seat do NOT count as occupants and can be dismembered.
;             Default 0.90. 0 = off (old strict guard - use it
;             if cars start vanishing again).
; VehShieldRange = radius (m) in which cars and bodies are shielded from
;             CLONE_PED when a torso is split. Default 20, up to 80.
;             Also settable in the menu (Gore > Details).
; HitRadius  = distance (meters) a hit may be from the bone
;             for the limb to be severed. 0.10 to 5.00, default 0.45.
;             Higher values = things come off much more easily.
; NonLethalLimbs = peds can survive limb loss (random): 0 = off,
;             1 = on (default). One lost limb may be survived
;             (normal ~50%, cops ~80%). Head, torso and the second
;             limb still kill instantly.
; BleedOutSeconds = seconds until bleeding out (default 12).
; TorsoForce= impulse on the upper half when splitting:
;             0 = off (default) 1 = on. Pushes it away from the shooter.
; TorsoGlue = attach the upper half firmly to the lower: 0 = off
;             (default) 1 = on. Prevents drifting apart,
;             but the upper half no longer ragdolls on its own.
; TorsoCap  = wound cap at the torso cut: 0 = off (default),
;             1 = on. Off while the model does not fit yet.
; TorsoCapRot = orientation of the torso wound cap, 0 to 4.
;             0 = as before, 1 = (0,90,0), 2 = (0,-90,0),
;             3 = (90,0,0), 4 = (0,-90,170), 5 to 10 = fine steps
;             around 4. Try them out, 0 to 10.
; TorsoTether = weak spring between the torso halves:
;             0 = off (default) 1 = on. Holds the wound caps
;             together without freezing the bodies.
; IniVersion = do NOT edit by hand. The mod uses it to tell whether
;             this file is from an older version. If so,
;             the feature switches are set once to the defaults
;             of the new version. Language, key, crosshair,
;             weapon list and blood settings are kept.
; Diagnose = how detailed the log is: 1 = everything including
;             measurements (default while testing), 0 = messages only.
;             Use 0 when sending a log for a specific bug
;             report.
; VehicleMinSpeed = the speed a vehicle must reach before it can
;             dismember at all, in m/s. 8 = about 29 km/h (default).
;             0 = off, then every contact counts as before.
;             The peak of the last 1.5 s is measured.
; FallWatch = logs from the cut until 3 s after what happens to the
;             ped (fall, ragdoll end, anim): 0 = off 1 = on.
; WritheFaceTarget = whether the ped turns toward the player at the
;             start of the writhe animation: 1 = on (default), 0 = off.
;             Try 0 if the turn into the animation looks off.
; WritheInvincible = with NonLethalAnim=1 keep the ped invincible
;             until the bleed-out timer ends, else TASK_WRITHE
;             kills him instantly: 1 = on (default), 0 = off.
; MoneyDrop = killed peds drop loot: 1 = on, 0 = off.
; MoneyChance = how often anything drops at all, in percent. 65.
; MoneyMin / MoneyMax = range in a normal district. 30 to 800.
; MoneyRichMin / MoneyRichMax = range in rich areas and for
;             well-dressed peds. 500 to 5000.
; MoneyBig = 1 = big drops (as before), 0 = normal GTA amounts.
; DrugDrop = bums drop a drug package instead of money:
;             1 = on, 0 = off (then they only drop coins).
; MeleeRandomHits = melee severs on the 1st or 2nd hit -
;             rolled per ped and limb, this value is the upper
;             bound. 1 = always instant. Default 2.
;             Only BLADES sever (knife, machete, hatchet, axe).
;             Blunt weapons like the bat cut nothing.
; ProtectMissionPeds applies since v237 ONLY with GameMode=1 (Story).
; MeleeKeepAlive = with MeleeBluntHits > 1 keep the ped alive until
;             the last hit: 1 = on (default), 0 = off.
; MeleeKeepHealth = the value refilled to meanwhile. 120.
; FallHoldsDown = without animation, hold the fall until death
;             so the ped does not get up again on one leg:
;             1 = on (default), 0 = off. Only with NonLethalAnim=0.
; AnimEarly = start the writhe anim already during the ragdoll:
;             1 = on (default), 0 = only after the ragdoll.
;             1 prevents the single frame in the standing pose.
; AnimBlendIn = how fast the writhe anim blends in. Higher =
;             faster. 4 was the old value, default now 1000
;             (= instant). Lower it only if it snaps in too
;             hard - e.g. 60 or 30.
;             Range 1 to 1000.
; AnimRelay = restart a finished writhe anim: 1 = on
;             (default), 0 = off. 0 is the counter-test whether
;             the restart itself causes the twitching.
; AnimWatch = measures whether an anim moves or turns the ped
;             itself (mover track): 0 = off 1 = on. Logging only.
; TorsoReseat = watch the upper torso half when physics pushes it
;             up out during the split:
;             0 = off, 1 = measure only (default), 2 = also correct.
;             2 for testing only - see v208 in the log.
; TorsoReseatMax = offset in meters at which it corrects. 0.12.
; TorsoReseatFrames = how long it watches afterwards. 12 frames.
; TorsoReseatTries = correct at most this often, then give up. 4.
; TorsoFreeze = freeze both torso halves once they lie still:
;             0 = off (default) 1 = on. Prevents them from
;             sliding apart over seconds.
; ScanRange = radius in meters in which peds are monitored.
;             Default 60. Larger = more CPU per frame,
;             with no visible gain. 20 to 200.
; HideProbe = DIAGNOSTIC. -1 = off (default). 0 = ONLY the
;             hit bone is hidden, n = bone + n successors.
;             Helps find which bone drags the chest along
;             on Enhanced. Not for normal play.
; CapScale  = scale stump caps at runtime: 0=Off (default) 1=On.
;             Needs cap models with a scale animation. Without them
;             nothing happens except a note in the log.
; AnimalGore = dismember animals: 0=Off (default) 1=No stump cap 2=With cap
;             The caps are modeled for humans and do not fit animals.
; RespectNoDismemberDecor = other mods may exempt individual peds.
;             They set DECOR_SET_BOOL(ped, "NO_DISMEMBER", true).
;             The ped then dies normally but loses no limbs.
; NoDismemberDecors = extra decorator keys, comma-separated, that
;             also exempt - here it is enough that the key exists
;             on the ped. For mods that already set their own tag.
;             Example: NoDismemberDecors=VanguardTier
; ProtectCompanions = companions and friendly peds are NOT dismembered.
;             Affects peds in the player group (e.g. Lamar in a mission)
;             and all with a friendly relationship. Bystanders are neutral
;             and stay dismemberable. false = old version, everyone is dismembered.
; ProtectMissionPeds = peds the GAME marks as mission peds
;             are not dismembered - even hostile ones. For example enemies
;             you must beat up but not kill in a mission.
; GameMode   = 0 = Sandbox (everything as usual)
;              1 = Story: fists and kicks sever NOTHING,
;              bare-hand melee is like normal GTA V.
;              Weapons, blades and explosions still work normally.
;              Meant for story missions with fist fights.
; MeleeBluntHits = how many BLUNT melee hits are needed before a
;             limb comes off (1-10). Affects fist, baseball bat,
;             crowbar, hammer etc. Blades (knife, machete, hatchet)
;             still sever on the first hit. 1 = old version.
; BloodSplatter= blood splatter amount (0=Off 1=Low 2=Normal 3=High), independent of Preset
; Preset     = gore level (0=Realism 1=Medium 2=Extreme)
; HeadshotSound = 0=Off, 1-5=GTA sounds, 6+=custom headshotN.wav
; GroundBlood = ground blood (0=Off 1=Low 2=Medium 3=High). Until v131 it was
;             NOT in the INI and reset to Medium on every start.
; BloodPools= blood pool duration (0=1min 1=3min 2=stays)
; Killcam   = 0=Off 1=Camera pan (no slow-mo) | KillcamChance in % | KillcamDur 0=short 1=medium 2=long
; KillcamSpeed = camera speed 0=slow 1=medium 2=fast | KillcamInSlowMo = killcam also during kill slow-mo (default on)
; SlowMoEnabled = master switch. false = slow-mo completely off,
;             no matter what SlowMoKey and SlowMoPad are set to.
; SlowMo    = SlowMoKey, SlowMoPad (0=Off 1-6), SlowMoSpeed (0-3 world slow-mo), SlowMoPlayerMode (0=Quicksilver 1=Slomo), SlowMoSong (0-11, 12=Random)
; Crosshair = CrosshairStyle (0=Off, 1-5=Vector, 6+=PNG texture) | CrosshairColor (Index) | CrosshairSize (0=Small 1=Medium 2=Large)
