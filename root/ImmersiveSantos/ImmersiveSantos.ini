; Store robberies, step by step: a masked robber (or a small crew) waits in a car parked at the door of a 24/7. When you get close, the shop
; loads in, the crew gets out and walks in and aims at the clerk, who raises his hands. Then, like when you rob a shop yourself, the clerk turns to the
; register, opens it, puts the cash in a bag and hands it over: the bag goes straight into the robber's hand and he carries it to the car (see
; StoreRobRegisterScene below). The robbers hold him up from the customer side of the counter, straight in front of the clerk, and never step behind it.
; Then the ending is decided by a few independent rolls. Every chance is a percentage: 0 = never, 100 = always. (A robber who came on foot has worse
; odds, see StoreRobOnFootChance below.)
;   1. StoreRobKillClerkChance  = the robber shoots the clerk before leaving (shops only, never in a bank). Keep it low.
;   2. If he did: StoreRobKillPoliceChance = chance the police come after a killing (100 = always). Otherwise the crew just drives off.
;   3. If nobody was shot: StoreRobPoliceChance = chance the police come at all. No police = a clean getaway.
;      A bank robbery always brings the police.
;   4. If the police come: StoreRobCaughtOnFootShare = share of those cases where a patrol turns up in time and arrests the crew on foot
;      (hands up, officers aiming). The rest is a chase: they follow the getaway car (a helicopter, the FBI and SWAT join as it grows, see
;      below; how a chase ends is RobberyChaseCaughtChance further down).
; The defaults give about 6% clerk shot, 24% caught on foot, 30% chase and 40% clean getaway.
StoreRobKillClerkChance=6
StoreRobKillPoliceChance=100
StoreRobPoliceChance=57
StoreRobCaughtOnFootShare=44
; 4.1: the store robbery played step by step (1), or the earlier version (0). With 1 it is always a 24/7 shop (banks have BankRobbery and
;   GroupHeist; a hotspot of this event still uses the earlier version). Any shop can be picked now, also one you can see from afar.
;   The getaway car waits down the road until you are near the shop, pulls up at the kerb right in front of the door, nose the way
;   the traffic goes, the crew gets out (a lookout stays at the
;   door when there are three), walks in and holds the clerk up from a few metres away, coming on with their guns up. He raises his
;   hands, opens the till (the game's own animation, played where he stands so he stays on his floor), bags the money and throws the
;   bag over the counter; the robber picks it up. Whether one of them shoots the clerk or not (StoreRobKillClerkChance), they run
;   for the car and tear off: a clean getaway, or, if the clerk hit the alarm (StoreRobPoliceChance, likelier after a shooting),
;   a police chase. StoreRobCaughtOnFootShare and StoreRobKillPoliceChance are
