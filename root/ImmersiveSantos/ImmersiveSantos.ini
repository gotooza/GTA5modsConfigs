[EventSpots]
; =========================================================================
; EVENT HOTSPOTS - places YOU pick for one event
; In the game: menu > Events > (an event) > "Add hotspot here". Stand where the scene should happen, facing the way it should
; face (for a shop door or a row of pumps: the way people come out / the way the cars point), and choose it. It is saved below.
; To SEE where an event can happen and where its hotspots are: menu > Events > (an event) > "Show valid spots".
; (This is not the [Hotspots] section above, which is a different thing: fixed crowds.)
;
; Format, one per line, up to 24 per event:   <EventName>Spot1=x,y,z,heading
;   The event name is the one used in [Events] (GangFight, DrugDeal, BankRob, GasStation, StoreSiege ...).
;   Example:   GangFightSpot1=-61.20,-1851.70,26.80,320.0
; <EventName>Only=1   the event is ONLY ever built at its hotspots (default 0: it also keeps its usual random places).
;
; How it works: when an event is picked and one of its hotspots is "ready" - you are between about 0.8x MinSpawnDistance and
; 1.6x MaxSpawnDistance away, you cannot see it, the same event is not already there and it was not used lately - the event is built
; there (UseChance % of the time, always with Only=1). A ready hotspot also makes the event likelier (WeightBoostPercent) and lets it
; happen outside the zones it normally uses. Cooldowns, hours, gunfight pacing and "calm mode" still apply as usual.
; Road events are placed on the nearest road lane within 30 m of the spot, people on the nearest pavement.
; Fixed-site events: StoreRobbery uses the shop (or bank) next to the spot, BankRob uses the spot as the bank's doorstep,
; GasStation uses it as the pump line, DoorTraffic / OpeningQueue use it as the door, GroupHeist the shop or bank next to it.
; Not available: Kidnapping (never touched), ParkedCar, AirTraffic, PoliceHeli, Bennys.
; =========================================================================
Enabled=1
UseChance=70
WeightBoostPercent=200
SpotCooldownSec=300
Scatter=6.0
; Examples (remove the ; to use):
;GangFightSpot1=0.0,0.0,0.0,0.0
;GangFightOnly=0


