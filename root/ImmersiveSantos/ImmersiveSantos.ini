[SceneLife]
; Scenes without a script of their own come to life while you are near them: people talk with their hands, greet
; with a handshake, a hug or a high five, pass a drink or a cigarette, step aside to take a call, arrive and leave;
; workers check on each other, take a coffee break and fetch tools from the truck; stalls and food trucks serve a
; queue one by one; street shows draw people who stop, cheer, film and tip; police talk on the radio and to witnesses.
; The flat tyre is changed step by step, cars fill up at the gas station, taxis take fares, the bus comes to the stop.
Enabled=1
; Seconds between two new things happening in one scene (a few can run at the same time)
BeatMinSec=7
BeatMaxSec=14
; When a scene's time is up while you are watching it, it winds down step by step (goodbyes, people leave in ones
; and twos, the cars are driven away) instead of standing there for ever
WindDown=1
; Only scenes this close to you (m) start anything new
ActiveRange=90
; 4.1: a box carried in both hands (deliveries, removals...): how far in front of the body it is held and how high its middle is
; (metres, from the hips). Raise CarriedBoxGap if it goes into the chest, CarriedBoxHeight if it hangs too low.
CarriedBoxGap=0.20
CarriedBoxHeight=0.12

