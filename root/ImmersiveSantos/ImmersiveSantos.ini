[GunFights]
; Everything about shootings in one place: gang fights, gang wars, drive-bys, murders, police shootouts, gun deals, standoffs, armed robberies and so on.
; Master switch. 0 = REMOVES ALL GUNFIGHTS: no gang fights, wars, drive-bys, murders, shootouts, gun deals, standoffs, armed robberies, deals going wrong,
; gangs attacking you for staying on their street, and nobody pulls a gun on you. Use it if gunfights ever cause problems.
Enabled=1
; NO SHOOTINGS AT ALL. 1 = a total ban on every kind of shooting: no gunfights of any type, no armed robberies, heists, store sieges, armored truck
; attacks, SWAT/police raids or shootouts, and armed people never fire a shot (this applies in the whole map). Gunfire only happens if you shoot first or have a wanted level. 0 = off.
