; StoreRobBagInScene = 1: the bag is part of the hold-up animation and plays its own clip ("holdup_victim_20s_bag"), so it is thrown exactly as the
; animation says and ends up on the floor where the animation puts it. If the game will not play that clip the bag is held in the clerk's hand
; instead (the log says so); 0 = always held in the hand.
; StoreRobThrowAtPercent = only for a bag held in his hand: the point of his animation (percent, 50 to 95) where it leaves his hand and goes
; to the floor. Never before the animation has got that far.
StoreRobBagInScene=1
StoreRobThrowAtPercent=82
; What happens when the clerk has finished the animation:
;   StoreRobThrowToFloor = 1: the bag is on the floor, the robber walks up to it, bends down and picks it up, and
;                          only then the ending of the robbery is rolled (kill the clerk / police come / caught or chase / clean getaway).
;                          0: it goes straight into the robber's hand.
;   StoreRobThrowDistance = (bag held in the hand, or a clip bag that landed out of reach) how far in front of the robber (towards the clerk) the bag
;                          lands, in metres (0.4 to 3). If that spot is not floor level (the counter top), a nearer spot is used.
;   StoreRobThrowMs       = how long such a bag is in the air, in milliseconds (200 to 2000).
;   StoreRobPickupMs      = how long the robber's pick-up animation lasts, in milliseconds (600 to 4000).
;   StoreRobPickupBagAtPercent = the point of the pick-up (percent) where the bag reaches his hand (10 to 90).
StoreRobThrowToFloor=1
StoreRobThrowDistance=1.2
StoreRobThrowMs=600
StoreRobPickupMs=1700
StoreRobPickupBagAtPercent=45
; How far from the clerk the robbers stand while they aim at him, in metres (1.8 to 5). They stand on the customer side of the counter, straight
; in front of him. Further = they hold him up from more of a distance; if the shop is too cramped they use the nearest free spot in front of him.
StoreRobStandDistance=2.6
; How long the crew keeps the clerk covered, hands up, before the register scene starts: a random time between these two values, in seconds.
StoreRobAimMinSec=4.5
StoreRobAimMaxSec=7.0
; The other people in the shop when the gun comes out: percentage that drops to the floor (the rest runs for the door).
StoreRobCustomersCowerChance=55
; The robber who takes the bag lowers his gun while he holds it (1), so the bag hangs at his side. 0 = he keeps aiming (the bag is then held
; up at head height, like the arm).
StoreRobLowerGunWithBag=1
; The bag of cash. Any prop model works (prop_money_bag_01 = black money bag, prop_poly_bag_money = plastic bag, prop_cs_shopping_bag = shopping
; bag); if the model cannot be loaded the next one is tried.
StoreRobBagModel=prop_money_bag_01
; Where the bag sits in the hand (metres, relative to the hand) and how it is turned (degrees). Two sets: the CLERK's hand (while he fills the
; bag and holds it out) and the ROBBER's hand (while he carries it; also used for the bank robbers' bags). If a model sits wrong in the hand,
; change these while you watch a robbery (they are also in the menu: Crime & Police > Robbery: the bag). The defaults suit the plastic bag.
StoreRobBagClerkPosX=0.10
StoreRobBagClerkPosY=-0.11
StoreRobBagClerkPosZ=0.08
StoreRobBagClerkRotX=0.0
StoreRobBagClerkRotY=-75.0
StoreRobBagClerkRotZ=-75.0
StoreRobBagRobberPosX=0.10
StoreRobBagRobberPosY=-0.11
StoreRobBagRobberPosZ=0.08
StoreRobBagRobberRotX=0.0
StoreRobBagRobberRotY=-75.0
StoreRobBagRobberRotZ=-75.0
; THE REGISTER. The game's hold-up animation is made for one spot: the clerk starts a step behind the register and works it from there. Played
; from anywhere else he slides along the counter (or through it) and ends up away from the till. So, before the animation starts, the clerk is
; walked to the spot it begins from (and set on it exactly), and the animation is played ON the register:
;   - if a register prop (StoreRobRegisterModels) is next to his post, a synchronized scene is placed on it and the whole animation happens at the
;     register;
;   - if there is none, or the start spot of the animation is farther than StoreRobRegisterMaxMove from his post, he is put back on his post (where
;     the shop put him, behind the register) and the animation is played from there.
; The log line "store robbery: the register animation is placed on the register ..." tells which one was used, and how far he was moved.
; 1 = the clerk is put on the animation's start spot and the animation is played on the register; 0 = it is played wherever he stands (old way).
StoreRobAnchorToRegister=1
; The register prop can face any way. 1 = the four ways are tried and the one whose start spot is nearest to the clerk's post is used;
; 0 = only the way the prop is turned (plus StoreRobRegisterTurn).
StoreRobRegisterAutoTurn=1
; Register props looked for next to the clerk's post (comma separated model names).
StoreRobRegisterModels=prop_till_01,prop_till_02,prop_till_03,prop_till_01_dam,prop_till_02_dam,prop_till_03_dam
; How far around the clerk's post a register prop is looked for, in metres (0.5 to 12). If the register ends up not being used in some
; shops (the clerk bends over the wrong thing instead of a till), raise this a little first.
StoreRobRegisterSearchRadius=5.5
; The farthest the clerk is moved to the start spot of the animation, in metres (0.2 to 6). If the spot is farther from his post than this, the
; register that was found is not his and he works the animation from his post instead. Raise it a little if your clerks keep being left at
; their post (menu: Crime & Police > Robbery: the register > "show the spots" shows both).
StoreRobRegisterMaxMove=1.2
; The longest the clerk gets to walk to his start spot before he is set on it, in milliseconds (300 to 8000).
StoreRobRegisterWalkMs=2500
; Fine tuning of the whole animation on the register: sideways and forward in metres (-2 to 2), turned in degrees (-180 to 180). All 0 = exactly as
; the animation was made. Change them while you watch a robbery with StoreRobRegisterDebug=1 (or in the menu) until the clerk stands right.
StoreRobRegisterOffsetX=0.0
StoreRobRegisterOffsetY=0.0
StoreRobRegisterTurn=0.0
; Height, in metres (-1.5 to 1.0). The mod measures the clerk after the animation starts and corrects the height on
; its own, so this should normally stay at 0. Only change it if a particular store still looks off: negative lowers
; him further, positive raises him.
StoreRobRegisterOffsetZ=0.0
; 1 = during a store robbery draw the clerk's post (yellow), the start spot of the animation (green, the line is the way he faces) and the
; origin of the animation on the register (blue). For tuning only.
StoreRobRegisterDebug=0
; The police turn up while the crew is still about. A crew does not just wait to be taken:
;   StoreRobFightPoliceChance   = percent: it opens fire on the patrol (in a chase the passengers shoot from the car and the officers shoot back; on
;                                 foot everybody gets out and fights). Only where shooting is allowed (see [Police] CriminalsResistPolice).
;   StoreRobRunFromPoliceChance = percent: a crew waiting on foot for the patrol runs back to the car and drives off, and the police chase them.
;   What is left over (100 minus both) waits to be arrested, or in a chase ends as before (caught or away, see the ending weights above).
; While shots are exchanged the response grows, at most once every StoreRobEscalateEverySec seconds (and at once when an officer goes down):
; a heavier level, one more patrol car (at most StoreRobMaxPoliceCars on the scene), then the helicopter, the FBI and SWAT arrive earlier.
StoreRobFightPoliceChance=40
StoreRobRunFromPoliceChance=40
StoreRobEscalateEverySec=20
StoreRobMaxPoliceCars=6
; A crew that gives up (or is run down in a chase) is actually arrested: an officer walks over, cuffs him, walks him to
; the police car and drives him off, instead of just standing there with hands up until the scene times out and vanishes.
; Turn this off to go back to the old behaviour. A crew that shoots it out is unaffected: that already ends in a fight.
StoreRobPoliceArrest=1
; Gang hangout: parked cars along the kerb (min/max).
GangHangoutCarsMin=2
GangHangoutCarsMax=3
; Of the armed members, how many (%) actually hold the weapon out in view instead of just carrying it holstered.
GangHangoutWeaponsDrawnChance=25
; A guard dog at the lookout's feet, sometimes.
GangHangoutDog=1
; Every getaway chase (shops, ATMs, banks, armoured trucks): how long it goes on before it is settled (a random time between these two values,
; in seconds) and the chance it ends with the crew caught and arrested. Otherwise the police give up and the crew gets away.
RobberyChaseMinSec=45
RobberyChaseMaxSec=100
RobberyChaseCaughtChance=50

; ---- Bank robbery (the BankRob event; its weight, hours and zones are in [Events] further down) ----
; A crew in an armoured Kuruma parks at the door of a bank - Pacific Standard, any of the Fleecas, Paleto Bay - and waits there with the engine
; running until you are close. Then they get out, walk in (the bank interiors do not load, so they spend the time inside out of sight at the
; door), and come out with a bag of cash each. What happens next depends on the ZONE and on luck:
;   * the police are already waiting outside (BankRobZonePolice, first number): the crew walks out into their guns and gives up, shoots it out
;     or runs for the car (the three Ending weights below); patrol cars, barriers, rifles on the door, a rooftop marksman, SWAT and a helicopter
;     where the zone calls for them
;   * nobody is there yet: they pile into the Kuruma and leave. Then (second number) the police may get on their tail, and the next two
;     numbers say how likely a helicopter and then a SWAT unit (with the FBI) join in. If the police do not catch up they simply get away.
; BankRobZonePolice = Zone:cornered/pursuit/helicopter/swat, all in percent. Downtown the law is on top of it, in the country it is a lone sheriff.
BankRobZonePolice=Downtown:55/90/75/70,Nightlife:45/80/60/55,Suburb:40/70/55/45,Beach:40/70/50/40,Hood:35/65/40/50,Industrial:30/55/35/40,Airport:55/85/65/60,Rural:20/50/25/15
; Scales every one of those numbers at once (100 = as written, 0 = no police ever, 200 = twice as likely, capped at 100 each).
BankRobPoliceScale=100
; When the crew walks out into the police line, as weights: gives up (hands up, cuffed), shoots it out (only where gunfights are allowed; counts as 0
; otherwise), breaks for the car (a pursuit starts at once).
BankRobEndSurrender=55
BankRobEndShootout=30
BankRobEndBreakout=15
; Crew size, driver included (2-4; the Kuruma seats four). With BankRobDriverWaits=1 one of them stays at the wheel and the rest go in;
; with 0 everybody goes in and one of them drives off afterwards.
BankRobCrew=4
BankRobDriverWaits=1
; The crew carries a bag of cash each when they come out.
BankRobBags=1
; The crew waits in the car until you are this close (metres), and gives up waiting after this many seconds (forced from the menu: twice as long).
BankRobActivateDistance=120
BankRobWaitSec=240
; How long they stay inside (seconds, random between the two). When the police are coming they stay in until the police are in position.
BankRobInsideMinSec=30
BankRobInsideMaxSec=50
; The getaway car (a model name). If it is not in your game an ordinary heist car is used.
BankRobGetawayCar=kuruma2
; On: the getaway car tries to park out of sight nearby (an alley, a back spot) within this many metres of the door, instead of always at the kerb right outside it. No alley found in range: it parks at the kerb at the door as before.
BankRobPreferAlley=1
BankRobAlleySearchRadius=35
; Muggings: scale (percent) of how often they happen in alleys and back streets and with gang members as muggers
; (both depend on the zone: Hood and Industrial most), chance of a second thug, chance the mugger shoots the victim
MuggingClosedPlacesScale=100
MuggingGangMuggerScale=100
MuggingTwoMuggersChance=25
MuggingShootChance=3
; Kidnapping: chance (%) it uses the full crew (driver plus two who grab and drag the victim into the van) instead of
; one kidnapper only. 100 = always the full crew.
KidnapDragSceneChance=100
; Security convoy: an armoured cash truck with an escort front and back. Chance the escort is police (otherwise company SUVs),
; chance the truck guards give up when held up, and the cash you can take from the back of the truck.
SecurityConvoyPoliceEscortChance=50
SecurityConvoyGuardsSurrenderChance=60
SecurityConvoyCashMin=15000
SecurityConvoyCashMax=45000
; ATM robberies: chance the robber runs on foot and a patrol arrives in time to catch him (hands up, covered by officers).
; Independent of "RespondToEvents". Otherwise it is a police pursuit (see the police chances above) or a clean getaway.
; (Store robberies use the StoreRob...Chance values further up.)
RobberyCaughtOnFootChance=20
; Armoured truck hijack: chance the guards shoot back instead of giving up
ArmoredTruckGuardsFightChance=35
; Drunk driver: chance somebody reports it (a patrol turns up), chance the driver floors it instead of pulling over
DrunkDriverPoliceChance=60
DrunkDriverFleeChance=25
; Street races: chance a race is broken up by a patrol that was sent for it. Carjacking: chance the police chase the stolen car
StreetRacePoliceChance=40
CarjackPoliceChance=35

; Chance a whole crew turns up to buy in bulk instead of a single customer.
GangBuysFromGangChance=30
; How often dealers and buyers run for it when the police get close.
DealerFleeFromPoliceChance=70
; Of those running, how many go for their car instead of legging it.
DealerTakesCarChance=45
; How close a cop has to get before they notice him, in metres.
DealerPoliceNoticeRadius=35
; Chance a car chase gets a helicopter overhead once it has been running a while.
ChaseHelicopterChance=35
; How many extra patrols can join a chase as it goes on.
ChaseExtraUnits=2

