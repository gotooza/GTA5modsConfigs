//Air One (SHVDN)
//Place this file in the scripts folder next to AirOne.dll

[Main]
//Extra helicopter models to take over, comma separated (LSR helis already built in)
HeliModels=
//If true, cops fighting the player also count as a pursuit (needed for Los Santos Red, which uses its own wanted system)
DetectCopCombat=True

[Heli]
//Height above the player/ground the helicopter flies at
FlightAltitude=170
//Catch-up speed when the helicopter is far out of position
FlightSpeed=190
//Speed the helicopter orbits at (it will go faster if the player is in a fast vehicle)
OrbitSpeed=35.5
//Radius of the orbit around the player
OrbitRadius=200
//Direction of the orbit: Counterclockwise or Clockwise
OrbitRotation=Counterclockwise
//Seconds to stay on scene after the pursuit ends (maximum 300)
TimeToRemainOnscene=20
//Radians of the circle covered by each waypoint (0.6 - 1.6)
//Higher = smoother, fewer task resets but a wider, more angular orbit
//Lower = tighter, rounder orbit 
TaskLookahead=0.9

[Radar]
//If true, a blip is shown on the radar for the helicopter
EnableHeliBlip=True
//If true, the blip only shows on the minimap when nearby
HeliBlipShortRange=True

[Features]
//If true, the helicopter's own searchlight is switched on at night
EnableSearchlight=True
