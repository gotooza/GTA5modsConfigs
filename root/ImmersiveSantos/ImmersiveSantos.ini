; =========================================================================
; STABILITY
; Everything here is about not crashing. None of it changes how the game plays: the defaults are the safest values.
; Leave it all as it is unless you are chasing a problem.
; Other settings that exist for stability live elsewhere: [Performance] (WorldPedLimit, WorldVehicleLimit, WarmupMs, TeleportDistance,
; ModelWaitMs, RaycastsPerFrame, RetireEntitiesPerFrame), [Memory] (MaxModelsInMemory, NewModelsPerFrame) and [Logging].
; =========================================================================
[Stability]
; Master switch for everything in this section.
Enabled=1
; Each part of the mod runs inside a safety net. If something goes wrong in one part (a script error or a bad memory access) it is written
; to the log and that part is skipped for a moment, instead of the game crashing. An event that fails is simply removed.
ErrorGuard=1
; If the same part fails this many times within ErrorWindowSeconds it is switched off until you restart the game (a message tells you which one).
; The rest of the mod keeps working. Look for lines starting with STABILITY in the log.
ErrorsBeforeSwitchOff=5
ErrorWindowSeconds=180
; Nothing is touched during cutscenes and character switches, which is where scripts most often disturb the game.
PauseDuringCutscenes=1
; If the player ped changes (a save was loaded, you switched character, the game respawned you) every event is cleaned up, because everything it held belongs to the old world.
ResetWhenPlayerChanges=1
; If the game runs below LowFpsLimit frames per second for a few seconds, nothing new is created for LowFpsPauseSeconds, so the mod never makes a struggling game worse.
LowFpsGuard=1
LowFpsLimit=18
LowFpsPauseSeconds=8
; Hard ceilings for how many people and vehicles may exist in the whole world, whatever the density amounts say.
; Nothing spawns past them. The game crashes when its pools are full, so keep them below the game's own pool sizes (256 peds, 262 vehicles).
AbsoluteMaxPeds=235
AbsoluteMaxVehicles=205
; Silly values in this ini (zero, negative, enormous distances or intervals) are pulled back into a safe range when it loads.
SanityCheckIni=1
; 4.1: a scene's car that nobody drives (it ended, or it could not be finished) is never left standing on the road, empty
; and with its doors open: once nobody can see it, it is taken away. A parked car a scene borrowed has its doors shut
